<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>대기실 운영 · 무용 심화 멘토링</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{
  --teal:#176C86; --teal-deep:#1C6077; --teal-ink:#0F4252; --teal-soft:#E6F0F3;
  --ivory:#FAF9F5; --paper:#fff; --ink:#212326; --muted:#5F6368;
  --coral:#E84958; --coral-soft:#FDECEE; --apricot:#FFB098; --apricot-soft:#FFE9E0;
  --green:#1F9D61; --grey-soft:#EEEEEC;
  --line:rgba(33,35,38,.12); --line-strong:rgba(33,35,38,.22);
  --head:'Paperlogy','Pretendard Variable',Pretendard,sans-serif;
  --body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;word-break:keep-all}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.25}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;background:var(--teal);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.coral{background:var(--coral)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* 로그인 */
#login{min-height:100vh;display:grid;place-items:center;background:var(--teal-deep);padding:20px}
.lcard{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:30px 26px}
.lcard .eb{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--teal)}
.lcard h1{font-size:24px;font-weight:800;margin:8px 0 6px}
.lcard p{color:var(--muted);margin:0 0 18px;font-size:14px}
.lcard input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:10px;outline:none}
.lcard .btn{width:100%;margin-top:10px;padding:13px;font-size:15px}
.lerr{color:var(--coral);font-size:13.5px;min-height:20px;margin-top:8px}

/* 앱 */
#app{display:none;height:100vh;flex-direction:column}
.top{background:var(--teal-deep);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top small{display:block;font-size:12px;color:rgba(255,255,255,.75);font-weight:600}
.tabs{display:flex;gap:6px;margin-left:12px}
.tab{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;padding:7px 12px;font-weight:700;font-size:14px}
.tab.on{background:#fff;color:var(--teal-ink)}
.top .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.conn{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:#7CE0A3}
.conn.off i{background:var(--apricot)}
.top .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.zbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 20px;border-bottom:1px solid var(--line);background:var(--teal-soft);font-size:13.5px}
.zbar.unset{background:var(--apricot-soft)}
.zbar .zl{font-weight:800;color:var(--teal-ink);white-space:nowrap}
.zbar.unset .zl{color:#8E3A12}
.zbar .zv{flex:1;min-width:160px;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zbar .zhint{flex:1;min-width:160px;color:#8E3A12;font-weight:600}
.zbar input{flex:1;min-width:220px;font:inherit;font-size:14px;padding:8px 11px;border:1.5px solid var(--line-strong);border-radius:9px;outline:none;background:#fff}
.zbar input:focus{border-color:var(--teal)}
.zbar .zerr{width:100%;color:var(--coral);font-weight:700;font-size:13px}
.zbar .zerr:empty{display:none}

.body{flex:1;display:grid;grid-template-columns:minmax(420px,1.25fr) 1fr;min-height:0}
.left{overflow-y:auto;padding:16px 16px 30px;border-right:1px solid var(--line)}
.right{display:flex;flex-direction:column;min-height:0;background:#fff}

.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.sum b{font-family:var(--head);font-size:18px;color:var(--ink);margin-left:4px}
.now{background:var(--coral);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;display:none}
.now b{font-family:var(--head);font-size:17px}

.st{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.st:hover{border-color:var(--line-strong)}
.st.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(23,108,134,.12)}
.st.called{background:#FFF5F6;border-color:var(--coral)}
.st.done{opacity:.55}
.st .no{font-family:var(--head);font-weight:800;font-size:18px;color:var(--teal);text-align:center}
.st .nm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st .meta{grid-column:2;font-size:12.5px;color:var(--muted)}
.st .last{grid-column:2/4;font-size:13px;color:var(--ink);background:var(--ivory);border-radius:8px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .act{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.dot{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.dot i{width:7px;height:7px;border-radius:50%}
.dot.on{background:#E3F6EC;color:var(--green)} .dot.on i{background:var(--green)}
.dot.off{background:var(--grey-soft);color:var(--muted)} .dot.off i{background:#B5B9BD}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px}
.badge.called{background:var(--coral);color:#fff}
.badge.done{background:var(--grey-soft);color:var(--muted)}
.badge.waiting{background:var(--teal-soft);color:var(--teal-ink)}
.unread{background:var(--coral);color:#fff;font-size:12px;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.brk{text-align:center;font-size:12.5px;color:var(--muted);margin:6px 0 10px}

/* 오른쪽: 공지 + 채팅 */
.bcbox{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--apricot-soft)}
.bcbox h3{font-size:15px;font-weight:800;margin-bottom:8px}
.bcbox form,.cin{display:flex;gap:8px}
.bcbox input,.cin input{flex:1;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;outline:none;background:#fff}
.bclist{margin-top:8px;font-size:13px;color:#7A3A2A;max-height:64px;overflow:auto}
.chead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chead b{font-family:var(--head);font-size:18px;font-weight:800}
.chead .sp2{margin-left:auto;display:flex;gap:6px}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--ivory)}
.msgs .empty{margin:auto;color:var(--muted);text-align:center;font-size:14px}
.m{max-width:80%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.m small{display:block;font-size:11px;opacity:.7;margin-top:3px}
.m.s{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.s .who{display:block;font-size:12px;font-weight:800;color:var(--teal);margin-bottom:2px;cursor:pointer}
.m.o{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.m.sys{align-self:center;background:var(--coral);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:5px 12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.quick button{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px}
.cin{padding:10px 16px 14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .left{border-right:0;border-bottom:1px solid var(--line);max-height:55vh}
  .tabs{margin-left:0}
}
</style>
</head>
<body>

<section id="login">
  <form class="lcard" id="loginForm" autocomplete="off">
    <div class="eb">2026 K예술영재 프로젝트</div>
    <h1>대기실 운영</h1>
    <p>무용분야 심화 멘토링 웹 대기실 관리 화면입니다.<br>접속 코드를 입력해 주세요.</p>
    <input type="password" id="code" placeholder="접속 코드" autofocus>
    <button class="btn" type="submit" id="loginBtn">입장</button>
    <div class="lerr" id="loginErr"></div>
  </form>
</section>

<div id="app">
  <header class="top">
    <div><small>무용분야 심화 멘토링</small><h1>대기실 운영</h1></div>
    <div class="tabs" id="tabs"></div>
    <div class="sp">
      <span class="conn" id="conn"><i></i><span>실시간</span></span>
      <button class="btn ghost sm" id="soundBtn" type="button">🔔 알림음 켬</button>
      <button class="btn ghost sm" id="resetBtn" type="button">회차 초기화</button>
      <button class="btn ghost sm" id="logoutBtn" type="button">나가기</button>
    </div>
  </header>
  <div class="zbar" id="zbar"></div>

  <div class="body">
    <div class="left">
      <div class="sum" id="sum"></div>
      <div class="now" id="now"></div>
      <div id="list"></div>
    </div>
    <div class="right">
      <div class="bcbox">
        <h3>📢 상단 고정 공지 <span style="font-weight:500;font-size:12.5px;color:#8E3A12">(학생 채팅창 위에 고정)</span></h3>
        <form id="bcForm"><input id="bcText" maxlength="300" placeholder="예: 앞 순서가 5분 정도 늦어지고 있습니다. 조금만 기다려 주세요."><button class="btn coral" type="submit">전체 보내기</button></form>
        <div class="bclist" id="bcList"></div>
      </div>
      <div class="chead" id="chead"><b>대기실 채팅</b><span style="color:var(--muted);font-size:13px" id="cheadSub"></span></div>
      <div class="msgs" id="msgs"><div class="empty">아직 대화가 없습니다.</div></div>
      <div class="quick" id="quick">
        <button type="button">안녕하세요! 운영진입니다. 순서가 되면 입장 버튼을 열어 드릴게요.</button>
        <button type="button">잠시 후 입장 안내드릴게요. 조금만 기다려 주세요.</button>
        <button type="button">ZOOM 표시 이름을 ‘무용_이름’으로 바꿔 주세요.</button>
        <button type="button">비디오와 오디오를 켜고 입장해 주세요.</button>
        <button type="button">곧 순서입니다. 화면을 켜 두세요.</button>
      </div>
      <form class="cin" id="chatForm"><input id="chatText" maxlength="300" placeholder="채팅방 전체에 보낼 메시지 (학생 이름을 누르면 @이름이 붙습니다)"><button class="btn" type="submit">보내기</button></form>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxlDl4HN6qOaHON0t_xhAkrxNr0EcGAy8HM7G6o4Ij3JTbLSmEV8lBnUztPwx7qGKAy/exec',
  POLL_MS: 3000,
};
const SESS = { 1:'1회차 10/25', 2:'2회차 11/22', 3:'3회차 12/6' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = t => new Date(t).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Seoul' });
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t.h); t.h=setTimeout(()=>t.classList.remove('on'),1800); }
async function api(action, body){
  const r = await fetch(CONFIG.SCRIPT_URL, { method:'POST', body: JSON.stringify(Object.assign({ action, code: CODE }, body)) });
  return r.json();
}

let ZOOM_EDIT = false, ZOOM_CUR = null;   // 링크 입력 중에는 자동 새로고침이 입력칸을 덮지 않음
let CODE = '', session = 1, DATA = null, timer = null, fails = 0, sound = true, audio = null, lastMsgId = -1, lastChatSig = '';

/* ── 로그인 ── */
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); CODE = $('#code').value.trim(); if (!CODE) return;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch(_){}
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  try{
    const r = await api('op_state', { session });
    if (!r.ok){ $('#loginErr').textContent = r.error; return; }
    try { sessionStorage.setItem('dm_room', CODE); } catch(_){}
    start(r);
  }catch(_){ $('#loginErr').textContent = '연결에 문제가 있습니다.'; }
  finally{ $('#loginBtn').disabled = false; }
});
function start(r){
  $('#login').style.display = 'none'; $('#app').style.display = 'flex';
  renderTabs(); apply(r); schedule();
}
$('#logoutBtn').addEventListener('click', ()=>{ try{ sessionStorage.removeItem('dm_room'); }catch(_){} location.reload(); });
$('#soundBtn').addEventListener('click', ()=>{ sound = !sound; $('#soundBtn').textContent = sound ? '🔔 알림음 켬' : '🔕 알림음 끔'; try{ audio && audio.resume(); }catch(_){} });

function renderTabs(){
  $('#tabs').innerHTML = [1,2,3].map(n=>`<button class="tab ${n===session?'on':''}" data-s="${n}" type="button">${SESS[n]}</button>`).join('');
}
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('.tab'); if(!b) return; session=+b.dataset.s; lastMsgId=-1; lastChatSig=''; ZOOM_EDIT=false; ZOOM_CUR=null; renderTabs(); $('#list').innerHTML=''; $('#msgs').innerHTML=''; refresh(); });

/* ── 주기적 새로고침 ── */
function schedule(){ clearTimeout(timer); timer = setTimeout(refresh, Math.min(CONFIG.POLL_MS * (1 + fails), 15000)); }
async function refresh(){
  try{
    const r = await api('op_state', { session });
    if (!r.ok && r.auth){ clearTimeout(timer); timer = null; try{ sessionStorage.removeItem('dm_room'); }catch(_){}   // 코드가 바뀌면 반복 요청으로 잠기지 않도록 로그인 화면으로
      $('#app').style.display = 'none'; $('#login').style.display = 'grid'; $('#loginErr').textContent = r.error; return; }
    if (!r.ok){ toast(r.error); throw new Error(r.error); }
    fails = 0; $('#conn').classList.remove('off'); $('#conn').querySelector('span').textContent = '실시간';
    apply(r);
  }catch(_){ fails++; $('#conn').classList.add('off'); $('#conn').querySelector('span').textContent = '재연결 중…'; }
  schedule();
}
function beep(){
  if (!sound || !audio) return;
  try{ audio.resume && audio.resume(); const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=660; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.0001,audio.currentTime); g.gain.exponentialRampToValueAtTime(.25,audio.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.25); o.start(); o.stop(audio.currentTime+.27);}catch(_){}
}

function ago(t, now){ if (!t) return '미접속'; const s = Math.round((now - t)/1000); return s < 60 ? `${s}초 전` : `${Math.round(s/60)}분 전`; }
function apply(r){
  DATA = r;
  renderZoom(r.zoomLink || '');
  const L = r.list, real = L.filter(x=>!x.test);
  const on = real.filter(x=>x.online).length, done = real.filter(x=>x.status==='done').length, called = L.find(x=>x.status==='called');
  $('#sum').innerHTML = `<div>접속 중<b>${on}</b>/${real.length}</div><div>대기<b>${real.filter(x=>x.status==='waiting').length}</b></div><div>완료<b>${done}</b></div><div>채팅<b>${r.msgs.filter(m=>m.f==='s').length}</b></div>`;
  $('#now').style.display = called ? 'block' : 'none';
  if (called) $('#now').innerHTML = `지금 입장 허용됨 · <b>${called.test?'테스트':called.order+'번 '}${esc(called.name)}</b> (${esc(called.time)})`;

  // 학생 새 메시지 알림
  const maxId = r.msgs.length ? r.msgs[r.msgs.length-1].i : 0;
  if (lastMsgId >= 0 && r.msgs.some(m=>m.i > lastMsgId && m.f==='s')) beep();
  lastMsgId = maxId;

  let html = '';
  L.forEach((x, k)=>{
    html += `<div class="st ${x.status}" data-n="${esc(x.name)}">
      <div class="no">${x.test?'T':x.order}</div>
      <div class="nm">${esc(x.name)} <span class="dot ${x.online?'on':'off'}"><i></i>${x.online?'접속 중':ago(x.seenAt, r.now)}</span>
        <span class="badge ${x.status}">${x.status==='called'?'입장 허용됨':x.status==='done'?'완료':'대기'}</span></div>
      <div class="act">
        ${x.status==='waiting' ? `<button class="btn coral sm" data-set="called" type="button">입장 허용</button>` : ''}
        ${x.status==='called' ? `<button class="btn sm" data-set="done" type="button">멘토링 완료</button>` : ''}
        ${x.status!=='waiting' ? `<button class="btn ghost sm" data-set="waiting" type="button">대기로</button>` : ''}
      </div>
      <div class="meta">${x.test?'테스트 계정':`대기실 ${esc(x.wait)} · 멘토링 ${esc(x.time)}`}</div>
    </div>`;
    if (!x.test && x.order % 10 === 5) html += `<div class="brk">— 휴식 —</div>`;
  });
  $('#list').innerHTML = html;

  $('#bcList').innerHTML = r.bc.slice().reverse().map(b=>`<div>${hhmm(b.t)} · ${esc(b.x)}</div>`).join('');
  renderChat();
}
function renderChat(){
  const msgs = DATA.msgs || [], on = DATA.list.filter(x=>!x.test && x.online).length;
  $('#cheadSub').textContent = `${SESS[session]} · 학생 ${on}명 접속 중`;
  const sig = session + '|' + (msgs.length ? msgs[msgs.length-1].i : 0);
  if (sig === lastChatSig) return;
  lastChatSig = sig;
  const box = $('#msgs');
  box.innerHTML = msgs.length ? msgs.map(m => m.f==='o'
      ? `<div class="m o">${esc(m.x)}<small>운영진 · ${hhmm(m.t)}</small></div>`
      : `<div class="m s"><span class="who" data-at="${esc(m.n)}">${esc(m.n)}</span>${esc(m.x)}<small>${hhmm(m.t)}</small></div>`).join('')
    : `<div class="empty">아직 대화가 없습니다.<br>아래 문구 버튼으로 첫 인사를 보내 보세요.</div>`;
  box.scrollTop = box.scrollHeight;
}
function mention(name){ const t = $('#chatText'); if (!t.value.startsWith('@'+name)) t.value = `@${name} ` + t.value.replace(/^@\S+\s*/, ''); t.focus(); }
$('#msgs').addEventListener('click', e=>{ const w = e.target.closest('[data-at]'); if (w) mention(w.dataset.at); });

/* ── ZOOM 링크 (회차별, 스크립트 속성에 저장 → 재배포 불필요) ── */
function renderZoom(link, force){
  if (ZOOM_EDIT && !force) return;
  if (link === ZOOM_CUR && !force) return;
  ZOOM_CUR = link;
  const z = $('#zbar'), note = session===1 ? ' · 테스트 계정도 이 링크 사용' : '';
  z.classList.toggle('unset', !link);
  if (ZOOM_EDIT || !link){
    z.innerHTML = `<span class="zl">${link ? '🎥 ZOOM 링크 변경' : '⚠ ZOOM 링크 미등록'} · ${SESS[session]}</span>
      <input id="zIn" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://us06web.zoom.us/j/123456789?pwd=… (암호 포함 초대 링크)" value="${esc(link)}">
      <button class="btn sm" id="zSave" type="button">저장</button>
      ${link ? `<button class="btn ghost sm" id="zCancel" type="button">취소</button><button class="btn ghost sm" id="zDel" type="button">삭제</button>` : ''}
      <div class="zerr" id="zErr"></div>`;
  } else {
    z.innerHTML = `<span class="zl">🎥 ZOOM 링크 등록됨 · ${SESS[session]}${note}</span>
      <span class="zv" title="${esc(link)}">${esc(link)}</span>
      <a class="btn ghost sm" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">열어 보기</a>
      <button class="btn ghost sm" id="zEdit" type="button">변경</button>`;
  }
}
async function saveZoom(url){
  const btn = $('#zSave'); if (btn) btn.disabled = true;
  try{
    const r = await api('op_zoom', { session, url });
    if (!r.ok){ $('#zErr') ? $('#zErr').textContent = r.error : toast(r.error); return; }
    ZOOM_EDIT = false; renderZoom(r.zoomLink, true);
    toast(url ? `${SESS[session]} ZOOM 링크를 저장했습니다` : `${SESS[session]} ZOOM 링크를 삭제했습니다`);
  }catch(_){ $('#zErr') && ($('#zErr').textContent = '연결에 문제가 있습니다. 다시 눌러 주세요.'); }
  finally{ if (btn) btn.disabled = false; }
}
$('#zbar').addEventListener('click', e=>{
  const id = e.target.id;
  if (id==='zEdit'){ ZOOM_EDIT = true; renderZoom(ZOOM_CUR, true); const i=$('#zIn'); i.focus(); i.select(); }
  else if (id==='zCancel'){ ZOOM_EDIT = false; renderZoom(ZOOM_CUR, true); }
  else if (id==='zSave'){ const v = $('#zIn').value.trim(); if (!v){ $('#zErr').textContent = '링크를 붙여 넣어 주세요.'; return; } saveZoom(v); }
  else if (id==='zDel'){ if (confirm(`${SESS[session]} ZOOM 링크를 삭제할까요?\n삭제하면 입장 허용된 학생에게 링크가 보이지 않습니다.`)) saveZoom(''); }
});
$('#zbar').addEventListener('focusin', e=>{ if (e.target.id==='zIn') ZOOM_EDIT = true; });
$('#zbar').addEventListener('keydown', e=>{ if (e.target.id==='zIn' && e.key==='Enter'){ e.preventDefault(); $('#zSave').click(); } else if (e.key==='Escape' && ZOOM_CUR){ ZOOM_EDIT=false; renderZoom(ZOOM_CUR, true); } });

/* ── 조작 ── */
$('#list').addEventListener('click', async e=>{
  const card = e.target.closest('.st'); if (!card) return;
  const name = card.dataset.n, b = e.target.closest('[data-set]');
  if (b){
    const to = b.dataset.set;
    const other = DATA.list.find(v=>v.status==='called' && v.name!==name);
    if (to==='called' && !ZOOM_CUR && !confirm(`${SESS[session]} ZOOM 링크가 아직 등록되지 않았습니다.\n입장 허용해도 학생에게 링크가 보이지 않습니다. 계속할까요?`)) return;
    if (to==='called' && other && !confirm(`${other.name} 학생이 아직 '입장 허용' 상태입니다. 그대로 두고 ${name} 학생도 입장 허용할까요?`)) return;
    b.disabled = true;
    const r = await api('op_set', { name, status: to });
    if (!r.ok) toast(r.error); else toast(to==='called' ? `${name} 학생 입장 허용` : to==='done' ? `${name} 학생 완료` : `${name} 학생 대기로`);
    refresh(); return;
  }
  mention(name);
});
$('#chatForm').addEventListener('submit', async e=>{
  e.preventDefault(); const text = $('#chatText').value.trim(); if (!text) return;
  $('#chatText').value = '';
  const r = await api('op_send', { session, text });
  if (!r.ok){ toast(r.error); $('#chatText').value = text; }
  lastChatSig = ''; refresh();
});
$('#quick').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; $('#chatText').value = b.textContent; $('#chatText').focus(); });
$('#bcForm').addEventListener('submit', async e=>{
  e.preventDefault(); const text = $('#bcText').value.trim(); if (!text) return;
  if (!confirm(`${SESS[session]} 대기 학생 전체에게 보낼까요?\n\n${text}`)) return;
  const r = await api('op_bc', { session, text });
  if (!r.ok) toast(r.error); else { $('#bcText').value = ''; toast('전체 공지를 보냈습니다'); }
  refresh();
});
$('#resetBtn').addEventListener('click', async ()=>{
  if (!confirm(`${SESS[session]}의 입장 상태·채팅·공지를 모두 지웁니다. (리허설 후 실제 운영 전에 사용)\n시트의 채팅 기록은 남습니다. 진행할까요?`)) return;
  const r = await api('op_reset', { session }); toast(r.ok ? '초기화했습니다' : r.error); lastChatSig=''; lastMsgId=-1; refresh();
});

/* 같은 탭에서는 코드 다시 묻지 않음 */
(async ()=>{ try{ const c = sessionStorage.getItem('dm_room'); if (c){ CODE = c; const r = await api('op_state', { session }); if (r.ok) start(r); } }catch(_){} })();
</script>
